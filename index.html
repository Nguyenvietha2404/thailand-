<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Học từ vựng tiếng Thái</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Noto+Sans+Thai+Looped:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ef;--ink:#14292b;--mut:#5d7071;--card:#fff;--line:#d5dcd6;--jade:#1d7468;--gold:#d99a1c;--bad:#b8402f;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c1e;--ink:#e7efe9;--card:#172a2c;--line:#2a4144;--mut:#93a9a9;--jade:#4cb8a6;--gold:#e8b445;--bad:#e2705e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Be Vietnam Pro',system-ui,sans-serif}
.th{font-family:'Noto Sans Thai Looped','Sarabun','Leelawadee UI',Tahoma,sans-serif}
header{padding:14px 16px 0;max-width:780px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:20px}h1 span{color:var(--jade)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.45em .7em}
nav{max-width:780px;margin:10px auto 0;padding:0 16px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;white-space:nowrap;padding:.6em .9em;color:var(--mut)}
nav button.on{color:var(--ink);border-color:var(--gold);font-weight:600}
main{max-width:780px;margin:auto;padding:16px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.55em 1em;border-radius:var(--r);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.good{background:var(--jade);color:#fff;border-color:var(--jade)}.bad{color:var(--bad);border-color:var(--bad)}
.ic{padding:.15em .5em;border-radius:99px}
.bar,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0}.row{justify-content:center}
.bar label{font-size:14px;color:var(--mut)}
.fc{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:290px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:6px}
.big{font-size:56px;line-height:1.3}.mid{font-size:24px}.rom{color:var(--gold);font-weight:600}.mut,.hint{color:var(--mut);font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:.8em 1em}
.opt.ok{background:var(--jade);color:#fff;border-color:var(--jade)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .th{font-size:22px}.k{opacity:.35}.k.on{opacity:1}
.cv{position:relative;width:300px;height:300px;max-width:100%;margin:10px auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.chips button{font-size:26px;min-width:48px}.chips .on{border-color:var(--gold);border-width:2px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6em 1em;border-radius:99px;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header><h1><span class="th">ภาษาไทย</span> · Từ vựng</h1><select id="scope" aria-label="Phạm vi ôn tập"></select></header>
<nav id="nav"></nav><main id="main"></main><div id="toast"></div>
<script>
/* ===== DỮ LIỆU GỐC: mỗi dòng = [STT, Tiếng Thái, Phiên âm, Tiếng Việt, Câu ví dụ] ===== */
const BASE=[["1","ต่างประเทศ","","nước ngoài","เขาจะไปเที่ยวต่างประเทศปีหน้า (Anh ấy sẽ đi du lịch nước ngoài năm sau)"],["2","สนุก","","vui vẻ","เมื่อวานเราไปเที่ยวทะเลสนุกมาก (Hôm qua chúng tôi đi biển rất vui)"],["3","จริงเหรอ","jing rỏo","thật thế à?","เธอสอบผ่านแล้วจริงเหรอ? (Cậu thi đỗ rồi thật à?)"],["4","กลับมา","klặp maa","trở về","แม่กลับมาจากทำงานแล้ว (Mẹ đã đi làm về rồi)"],["5","ของฝาก","khỏng faạc","quà (khi đi xa trở về)","ฉันซื้อของฝากมาจากเชียงใหม่ (Tôi mua quà từ Chiang Mai về)"],["6","ให้","hay^","cho","เขาให้หนังสือเล่มนี้กับฉัน (Anh ấy cho tôi cuốn sách này)"],["7","กระเป๋า","krạ pảu","túi xách","กระเป๋าใบนี้น่ารักมาก (Cái túi này rất dễ thương)"],["8","กระโปรง","krạ prôông","váy","เธอใส่กระโปรงสีแดง (Cô ấy mặc váy màu đỏ)"],["9","รองเท้า","roong tháo","giày","รองเท้าคู่นี้ราคาเท่าไหร่? (Đôi giày này giá bao nhiêu?)"],["10","ยี่ห้อ","yii^ hoo^","nhãn hiệu","คุณชอบยี่ห้ออะไร? (Bạn thích nhãn hiệu nào?)"],["11","ใช้","cháy","dùng","ฉันใช้โทรศัพท์นี้มาสองปีแล้ว (Tôi dùng điện thoại này được 2 năm rồi)"],["12","ชอบ","choop^","thích","ฉันชอบกินส้มตำ (Tôi thích ăn nộm đu đủ)"],["13","ขอบใจ","khọp jay","cảm ơn (dùng cho ngang hàng/bạn bè)","ขอบใจสำหรับของขวัญนะ (Cảm ơn vì món quà nhé)"],["14","ส่วน","xuồn","còn, về phần","ส่วนฉัน ฉันจะอยู่บ้าน (Còn tôi, tôi sẽ ở nhà)"],["15","ใบ","bay","cái (dùng cho túi, mũ, lá...)","ฉันมีหมวก 1 ใบ (Tôi có 1 cái mũ)"],["16","ตัว","tua","cái (dùng cho quần áo, động vật)","เขาซื้อเสื้อ 2 ตัว (Anh ấy mua 2 cái áo)"],["17","คู่","khuu^","đôi","รองเท้า 1 คู่ (1 đôi giày)"],["18","ชุด","chút","bộ","เขาใส่ชุดนอนสีฟ้า (Anh ấy mặc bộ đồ ngủ màu xanh)"],["19","เส้น","sêên^","cái, dây, sợi","ก๋วยเตี๋ยว 1 เส้น (1 sợi mì)"],["20","ก้อน","koon^","cục, miếng","น้ำแข็ง 1 ก้อน (1 cục đá)"],["21","หลอด","laạt","ống, tuýp","ยาสีฟัน 1 หลอด (1 tuýp kem đánh răng)"],["22","กล่อง","kloòng","hộp","เขาซื้อนม 1 กล่อง (Anh ấy mua 1 hộp sữa)"],["23","วง","wông","cái (dùng cho nhẫn)","แหวน 1 วง (1 chiếc nhẫn)"],["24","ผืน","phửn","tấm (dùng cho khăn, vải)","ผ้าเช็ดตัว 1 ผืน (1 cái khăn tắm)"],["25","หมวก","muộc","mũ","วันนี้อากาศร้อน ต้องใส่หมวก (Hôm nay trời nóng, phải đội mũ)"],["26","เสื้อ","xưa^","áo","เสื้อตัวนี้สีอะไร? (Cái áo này màu gì?)"],["27","เสื้อเชิ้ต","xưa^ chít","áo sơ mi","พ่อใส่เสื้อเชิ้ตไปทำงาน (Bố mặc áo sơ mi đi làm)"],["28","เสื้อยืด","xưa^ yưưt^","áo phông","นักเรียนชอบใส่เสื้อยืด (Học sinh thích mặc áo phông)"],["29","เสื้อกันหนาว","xưa^ kăn nảo","áo rét","หน้าหนาวต้องใส่เสื้อกันหนาว (Mùa đông phải mặc áo rét)"],["30","เสื้อกันแดด","xưa^ kăn đeẹt","áo chống nắng","แดดร้อนมาก ใส่เสื้อกันแดดด้วย (Nắng nóng lắm, mặc áo chống nắng vào)"],["31","เสื้อกันฝน","xưa^ kăn phổn","áo mưa","ฝนตกแล้ว เอาเสื้อกันฝนไปด้วย (Mưa rồi, mang áo mưa đi nhé)"],["32","กางเกง","kang kêng","quần","กางเกงยีนส์ตัวนี้สวยมาก (Cái quần bò này đẹp lắm)"],["33","กางเกงขาสั้น / กางเกงขายาว","kang kêng khả săn^/ yaao","quần sooc / quần dài","ฉันชอบใส่กางเกงขาสั้นในฤดูร้อน (Tôi thích mặc quần sooc vào mùa hè)"],["34","ชุดนอน","chút noon","bộ đồ ngủ","เด็กๆ ใส่ชุดนอนเข้านอน (Bọn trẻ mặc đồ ngủ đi ngủ)"],["35","ชุดชั้นใน","chút chắn nay","bộ đồ lót","ชุดชั้นในเป็นของใช้ส่วนตัว (Đồ lót là đồ dùng cá nhân)"],["36","เสื้อกล้าม","xưa^ klam^","áo lót (ba lỗ)","ผู้ชายใส่เสื้อกล้ามออกกำลังกาย (Đàn ông mặc áo ba lỗ tập thể dục)"],["37","กางเกงใน","kang kêng nay","quần lót","-"],["38","รองเท้าแตะ","roong tháo tẹ","dép lê","อยู่บ้านใส่รองเท้าแตะ (Ở nhà đi dép lê)"],["39","ถุงเท้า","thủng tháo","tất (vớ)","ถุงเท้าคู่นี้สีดำ (Đôi tất này màu đen)"],["40","ถุงมือ","thủng mưư","găng tay","หน้าหนาวต้องใส่ถุงมือ (Mùa đông phải đeo găng tay)"],["41","แว่นตา","ween^ taa","kính","คุณยายใส่แว่นตาอ่านหนังสือ (Bà đeo kính đọc sách)"],["42","นาฬิกาข้อมือ","naa lí kaa khoo^ mưư","đồng hồ đeo tay","นาฬิกาข้อมือเรือนนี้แพงมาก (Cái đồng hồ đeo tay này đắt lắm)"],["43","ต่างหู","tèng hủu","hoa tai","เธอใส่ต่างหูสีทอง (Cô ấy đeo hoa tai màu vàng)"],["44","แหวน","weẻn","nhẫn","แหวนแต่งงาน (Nhẫn cưới)"],["45","สร้อย","sooi^","dây chuyền","สร้อยคอเส้นน u ăn trong bếp)"],["67","ห้องน้ำ","hoong^ naám","phòng tắm","ห้องน้ำอยู่ทางไหน? (Phòng tắm ở hướng nào?)"],["68","ห้องนอน","hoong^ noon","phòng ngủ","ฉันนอนในห้องนอน (Tôi ngủ trong phòng ngủ)"],["69","ห้องทำงาน","hoong^ thăm ngaan","phòng làm việc","พ่อทำงานอยู่ในห้องทำงาน (Bố đang làm việc trong phòng làm việc)"],["70","เครื่องปรับอากาศ","khrương^ prắp aa kaạt","máy điều hòa","เปิดเครื่องปรับอากาศ (Bật điều hòa)"],["71","เครื่องทำน้ำอุ่น","khrương^ thăm naám ùn","bình nóng lạnh","อาบน้ำด้วยเครื่องทำน้ำอุ่น (Tắm bằng bình nóng lạnh)"],["72","ครบ","khrốp","đủ","ของใช้ครบแล้ว (Đồ dùng đã đủ rồi)"],["73","ทุกอย่าง","thúk yàng","mọi thứ","ทุกอย่างพร้อมแล้ว (Mọi thứ đã sẵn sàng)"],["74","เตียงนอน","tiêng noon","giường ngủ","เตียงนอนนุ่มมาก (Giường ngủ rất êm)"],["75","ตู้","tuu^","tủ","เสื้อผ้าอยู่ในตู้ (Quần áo ở trong tủ)"],["76","ใหญ่","yày","to, lớn","บ้านหลังนี้ใหญ่ (Ngôi nhà này to)"],["77","เล็ก","lêêk^","nhỏ","ห้องนี้เล็ก (Căn phòng này nhỏ)"],["78","ทราบ","saáp","biết (lịch sự)","ทราบแล้วครับ (Đã biết rồi ạ)"],["79","พา","phaa","dẫn, đưa","พาเพื่อนไปเที่ยว (Dẫn bạn đi chơi)"],["80","ของใช้","khỏng cháy","đồ dùng","ของใช้ในบ้าน (Đồ dùng trong nhà)"],["81","ด้วยอะไร","đuôi^ ạ ray","bằng gì","เขียนด้วยอะไร? (Viết bằng gì?)"],["82","เครื่อง","khrương^","cái (dùng cho máy móc)","เครื่องซักผ้า (Máy giặt)"],["83","เล่ม","lêêm^","cái (dùng cho sách, dao)","หนังสือ 1 เล่ม (1 quyển sách)"],["84","หลัง","lẳng","ngôi (ngôi nhà)","บ้าน 1 หลัง (1 ngôi nhà)"],["85","เตาแก๊ส","tua keét","bếp ga","แม่ทำอาหารบนเตาแก๊ส (Mẹ nấu ăn trên bếp ga)"],["86","กระทะ","krạ thá","chảo","ทอดไข่ในกระทะ (Rán trứng trong chảo)"],["87","ตะหลิว","tạ lỉu","muôi đảo (xào)","ใช้ตะหลิวผัดอาหาร (Dùng muôi đảo xào thức ăn)"],["88","หม้อ","moo^","nồi","ต้มน้ำในหม้อ (Đun nước trong nồi)"],["89","ทัพพี","thắp phii","muôi (múc canh)","ตักแกงด้วยทัพพี (Múc canh bằng muôi)"],["90","จาน","jaan","đĩa","อาหารอยู่บนจาน (Thức ăn ở trên đĩa)"],["91","ชาม","chaam","bát tô","กินก๋วยเตี๋ยวในชาม (Ăn phở trong bát tô)"] /* ===== LÕI ỨNG DỤNG ===== */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem('thai.'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('thai.'+k,JSON.stringify(v))}catch(e){}}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TH=/[\u0E00-\u0E7F]/, FONT="'Noto Sans Thai Looped','Sarabun','Leelawadee UI',Tahoma,sans-serif";
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};
function splitEx(s){s=String(s||'').trim();if(!s||s==='-')return['',''];const i=s.indexOf('(');return i<0?[s,'']:[s.slice(0,i).trim(),s.slice(i+1).replace(/\)\s*$/,'').trim()]}
function fromRow(r){r=r.map(c=>String(c??'').trim());const i=r.findIndex(c=>TH.test(c));if(i<0)return null;const[et,ev]=splitEx(r[i+3]);return{th:r[i],rom:r[i+1]||'',vi:r[i+2]||'',et,ev}}
let ALL=[],K=LS.get('known',{}),W=LS.get('wrong',{});
function build(){const seen=new Set();ALL=[...BASE,...LS.get('custom',[])].map(fromRow).filter(w=>w&&!seen.has(w.th+'|'+w.vi)&&seen.add(w.th+'|'+w.vi))}
function pool(){const s=LS.get('scope','all');let a=ALL;
 if(s==='unk')a=a.filter(w=>!K[w.th]);else if(s==='wrong')a=a.filter(w=>W[w.th]);else if(s[0]==='g'){const n=+s.slice(1)*20;a=a.slice(n,n+20)}
 return a.length?a:ALL}
function mark(w,ok){if(ok)K[w.th]=1;else delete K[w.th];LS.set('known',K)}
function miss(w){W[w.th]=(W[w.th]||0)+1;LS.set('wrong',W)}

/* Phát âm: giọng th-TH của thiết bị, nếu không có thì dùng Google TTS */
let q=[];speechSynthesis&&speechSynthesis.getVoices();
function say(t){const parts=String(t).split('/').map(s=>s.trim()).filter(Boolean);
 const v=window.speechSynthesis&&speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang.replace('_','-')));
 if(v){speechSynthesis.cancel();parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p);u.lang='th-TH';u.voice=v;u.rate=LS.get('rate',.85);speechSynthesis.speak(u)});return}
 q=parts;const next=()=>{const p=q.shift();if(!p)return;const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=th&q='+encodeURIComponent(p));a.onended=next;a.onerror=()=>toast('Không phát được âm thanh. Hãy cài giọng đọc tiếng Thái cho thiết bị.');a.play().catch(()=>a.onerror())};next()}
const spk=t=>`<button class="ic" data-say="${esc(t)}" aria-label="Phát âm">🔊</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});
document.addEventListener('keydown',e=>{if(App.keys&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))App.keys(e)});

/* Đăng ký module: thêm bài tập mới = gọi App.register({id,title,render(el,App)}) -> tự xuất hiện trên menu */
const App={modules:[],keys:null,say,spk,pool,shuf,esc,LS,toast,mark,miss,words:()=>ALL,
 register(m){this.modules=this.modules.filter(x=>x.id!==m.id);this.modules.push(m);nav()},
 go(id){location.hash=id}};
function nav(){const cur=location.hash.slice(1)||App.modules[0]?.id;
 $('#nav').innerHTML=App.modules.map(m=>`<button data-id="${m.id}" class="${m.id===cur?'on':''}">${esc(m.title)}</button>`).join('');
 $('#nav').onclick=e=>{const b=e.target.closest('button');if(b)App.go(b.dataset.id)}}
function show(){const id=location.hash.slice(1),m=App.modules.find(x=>x.id===id)||App.modules[0];if(!m)return;App.keys=null;nav();
 try{m.render($('#main'),App)}catch(e){$('#main').innerHTML='<p>Lỗi ở bài tập này: '+esc(e.message)+'</p>'}}
function scopeOpts(){const n=Math.ceil(ALL.length/20),s=LS.get('scope','all');
 $('#scope').innerHTML=`<option value="all">Tất cả (${ALL.length} từ)</option><option value="unk">Chưa thuộc</option><option value="wrong">Hay sai</option>`+
 Array.from({length:n},(_,i)=>`<option value="g${i}">Nhóm ${i+1} (${i*20+1}–${Math.min(i*20+20,ALL.length)})</option>`).join('');$('#scope').value=s}
$('#scope').onchange=e=>{LS.set('scope',e.target.value);show()};
window.addEventListener('hashchange',show);

/* ===== CÁC BÀI TẬP (MODULES) — thêm bài tập mới ở dưới dòng này ===== */

App.register({id:'list',title:'Từ vựng',render(el){
 el.innerHTML=`<input id="s" placeholder="Tìm tiếng Thái, phiên âm hoặc nghĩa…" style="width:100%"><div id="l"></div>`;
 const draw=()=>{const k=$('#s').value.trim().toLowerCase();
  $('#l').innerHTML=pool().filter(w=>!k||(w.th+w.rom+w.vi).toLowerCase().includes(k)).map(w=>`<div class="item"><div>${spk(w.th)}</div><div>
  <span class="th">${esc(w.th)}</span> <span class="rom">${esc(w.rom)}</span> <button class="ic k ${K[w.th]?'on':''}" data-k="${esc(w.th)}" aria-label="Đã thuộc">✔</button><br>${esc(w.vi)}
  ${w.et?`<div class="mut"><span class="th">${esc(w.et)}</span> — ${esc(w.ev)}</div>`:''}</div></div>`).join('')||'<p class="hint">Không có kết quả.</p>'};
 $('#s').oninput=draw;$('#l').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const w=ALL.find(x=>x.th===b.dataset.k);mark(w,!K[w.th]);b.classList.toggle('on')};draw()}});

App.register({id:'flash',title:'Flashcard',render(el){
 let d=shuf(pool()),i=0,f=false,rev=LS.get('rev',false),auto=LS.get('auto',true);
 const draw=()=>{const w=d[i],thSide=f!==rev;
  el.innerHTML=`<div class="bar"><b>${i+1}/${d.length}</b><label><input type="checkbox" id="rv" ${rev?'checked':''}> Hiện nghĩa Việt trước</label><label><input type="checkbox" id="au" ${auto?'checked':''}> Tự đọc</label><button id="sh">Xáo trộn</button></div>
  <div class="fc th" id="fc" tabindex="0">${!f?(rev?`<div class="big" style="font-family:'Be Vietnam Pro'">${esc(w.vi)}</div>`:`<div class="big">${esc(w.th)}</div>${spk(w.th)}`)
  :`<div class="big">${esc(w.th)}</div>${spk(w.th)}<div class="rom">${esc(w.rom)}</div><div class="mid" style="font-family:'Be Vietnam Pro'">${esc(w.vi)}</div>${w.et?`<div class="mut">${esc(w.et)}<br>${esc(w.ev)}</div>`:''}`}</div>
  <div class="row"><button id="pv">‹ Trước</button><button class="bad" id="no">Chưa thuộc</button><button class="good" id="ok">Đã thuộc</button><button id="nx">Sau ›</button></div>
  <p class="hint">Chạm thẻ hoặc nhấn Space để lật · phím ← → để chuyển thẻ</p>`;
  if(auto&&((!f&&!rev)||(f&&rev)))say(w.th);
  $('#fc').onclick=e=>{if(e.target.closest('[data-say]'))return;f=!f;draw()};
  $('#rv').onchange=e=>{rev=e.target.checked;LS.set('rev',rev);f=false;draw()};$('#au').onchange=e=>{auto=e.target.checked;LS.set('auto',auto)};
  $('#sh').onclick=()=>{d=shuf(d);i=0;f=false;draw()};
  const go=n=>{i=(i+n+d.length)%d.length;f=false;draw()};
  $('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);$('#ok').onclick=()=>{mark(w,true);go(1)};$('#no').onclick=()=>{mark(w,false);miss(w);go(1)};
  App.keys=e=>{if(e.key===' '){e.preventDefault();f=!f;draw()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)}};
 draw()}});

/* Bộ máy trắc nghiệm dùng chung cho Trắc nghiệm / Nghe / Điền từ */
function runQuiz(el,title,qs){let i=0,sc=0,bad=[];
 const draw=()=>{if(i>=qs.length){el.innerHTML=`<div class="fc" style="cursor:default"><div class="big">${sc}/${qs.length}</div><p>${sc===qs.length?'Tuyệt đối!':'Các từ sai đã được lưu vào nhóm “Hay sai”.'}</p>${bad.map(w=>`<div>${spk(w.th)} <span class="th">${esc(w.th)}</span> — ${esc(w.vi)}</div>`).join('')}
  <div class="row"><button class="good" id="again">Làm lại</button>${bad.length?'<button id="rw">Luyện các câu sai</button>':''}</div></div>`;
  $('#again').onclick=()=>runQuiz(el,title,shuf(qs));if(bad.length)$('#rw').onclick=()=>runQuiz(el,title,bad.map(w=>qs.find(x=>x.w===w)));return}
  const x=qs[i];el.innerHTML=`<div class="bar"><b>${title}</b><span>Câu ${i+1}/${qs.length} · Đúng ${sc}</span></div><div class="fc th" style="cursor:default">${x.prompt}</div><div id="o">${x.opts.map((o,j)=>`<button class="opt ${x.thOpt?'th':''}" data-j="${j}">${esc(o)}</button>`).join('')}</div><div class="row"><button id="nx" style="display:none" class="good">Tiếp ›</button></div>`;
  if(x.audio)say(x.w.th);let done=false;
  $('#o').onclick=e=>{const b=e.target.closest('.opt');if(!b||done)return;done=true;const ok=x.opts[+b.dataset.j]===x.ans;b.classList.add(ok?'ok':'no');
   if(ok)sc++;else{miss(x.w);bad.push(x.w);[...$('#o').children].find(c=>c.textContent===x.ans).classList.add('ok')}
   const nx=$('#nx');nx.style.display='';nx.focus();nx.onclick=()=>{i++;draw()};say(x.w.th)}};
 draw()}
function distract(w,key,n=3){const seen=new Set([w[key]]);const o=[];for(const x of shuf(ALL)){if(!seen.has(x[key])&&x.th!==w.th){seen.add(x[key]);o.push(x[key]);if(o.length===n)break}}return o}
function quizModule(id,title,modes){App.register({id,title,render(el){
 const m0=LS.get('qm'+id,modes[0][0]);
 el.innerHTML=`<div class="bar"><select id="qm">${modes.map(m=>`<option value="${m[0]}" ${m[0]===m0?'selected':''}>${m[1]}</option>`).join('')}</select><select id="qn"><option>10</option><option>20</option><option value="0">Tất cả</option></select><button class="good" id="go">Bắt đầu</button></div><div id="qa"></div>`;
 $('#go').onclick=()=>{const mode=$('#qm').value;LS.set('qm'+id,mode);let p=shuf(pool().filter(w=>mode!=='cloze'||(w.et&&w.et.includes(w.th.split('/')[0].trim()))));const n=+$('#qn').value;if(n)p=p.slice(0,n);
  if(ALL.length<4)return toast('Cần ít nhất 4 từ.');
  runQuiz($('#qa'),title,p.map(w=>{
   if(mode==='tv')return{w,prompt:`<div class="big">${esc(w.th)}</div>${spk(w.th)}<div class="rom">${esc(w.rom)}</div>`,ans:w.vi,opts:shuf([w.vi,...distract(w,'vi')])};
   if(mode==='vt')return{w,prompt:`<div class="mid" style="font-family:'Be Vietnam Pro'">${esc(w.vi)}</div>`,ans:w.th,thOpt:1,opts:shuf([w.th,...distract(w,'th')])};
   if(mode==='ln')return{w,audio:1,prompt:`<div class="big">🔊</div><button id="rp" onclick="App.say('${w.th.replace(/'/g,'')}')">Nghe lại</button>`,ans:w.vi,opts:shuf([w.vi,...distract(w,'vi')])};
   const key=w.th.split('/')[0].trim();return{w,prompt:`<div class="mid">${esc(w.et.replace(key,'＿＿＿'))}</div><div class="mut" style="font-family:'Be Vietnam Pro'">${esc(w.ev)}</div>`,ans:key,thOpt:1,opts:shuf([key,...distract(w,'th').map(t=>t.split('/')[0].trim())])}}))};
 $('#go').click()}})}
quizModule('quiz','Trắc nghiệm',[['tv','Thái → Việt'],['vt','Việt → Thái']]);
quizModule('listen','Nghe',[['ln','Nghe và chọn nghĩa Việt']]);
quizModule('cloze','Điền từ',[['cloze','Điền từ vào câu ví dụ']]);

App.register({id:'write',title:'Nét chữ',render(el){
 const S=300,P=pool();let wi=0,ci=0,raf=0,ctxs={};
 const seg=s=>window.Intl&&Intl.Segmenter?[...new Intl.Segmenter('th',{granularity:'grapheme'}).segment(s)].map(x=>x.segment):[...s];
 const chars=()=>seg(P[wi].th.split('/')[0].trim()).filter(c=>TH.test(c));
 el.innerHTML=`<div class="bar"><select id="ws" style="max-width:100%">${P.map((w,i)=>`<option value="${i}">${esc(w.th)} — ${esc(w.vi)}</option>`).join('')}</select><span id="sc"></span></div><div class="chips" id="ch"></div>
 <div class="cv"><canvas id="g" width="${S}" height="${S}"></canvas><canvas id="ink" width="${S}" height="${S}"></canvas><canvas id="me" width="${S}" height="${S}"></canvas></div>
 <div class="row"><button class="good" id="sim">▶ Xem mô phỏng nét viết</button><button id="clr">Xóa & viết lại</button><button id="chk">Chấm điểm</button></div>
 <p class="hint">Chữ mờ là nét mẫu: dùng chuột/ngón tay viết đè lên rồi bấm “Chấm điểm”. Phần mô phỏng chỉ quét theo chiều viết thông thường (từ đầu chữ xuống thân chữ), không phải thứ tự nét chuẩn của từng phụ âm. Hầu hết phụ âm Thái bắt đầu ở vòng tròn “đầu chữ”, rồi viết liền tới hết thân chữ; dấu thanh và nguyên âm trên/dưới viết sau cùng.</p>`;
 ['g','ink','me'].forEach(k=>ctxs[k]=$('#'+k).getContext('2d'));
 const paint=(c,ch,lw)=>{c.font=`${S*.6}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';if(lw){c.lineWidth=lw;c.lineJoin='round';c.strokeText(ch,S/2,S/2)}c.fillText(ch,S/2,S/2)};
 const ghost=()=>{cancelAnimationFrame(raf);Object.values(ctxs).forEach(c=>c.clearRect(0,0,S,S));ctxs.g.fillStyle='rgba(128,140,140,.28)';paint(ctxs.g,chars()[ci]||'')};
 const chips=()=>{$('#ch').innerHTML=chars().map((c,i)=>`<button class="th ${i===ci?'on':''}" data-i="${i}">${esc(c)}</button>`).join('')+spk(P[wi].th);$('#sc').textContent='';ghost()};
 const load=()=>{(document.fonts?document.fonts.load(`40px 'Noto Sans Thai Looped'`,P[wi].th).catch(()=>0):Promise.resolve()).then(ghost)};
 $('#ws').onchange=e=>{wi=+e.target.value;ci=0;chips();load()};$('#ch').onclick=e=>{const b=e.target.closest('[data-i]');if(b){ci=+b.dataset.i;chips();load()}};
 $('#clr').onclick=ghost;
 $('#sim').onclick=()=>{ghost();const t0=performance.now(),c=ctxs.ink,ch=chars()[ci];const step=n=>{const p=Math.min((n-t0)/2200,1),t=p*S*1.05;c.clearRect(0,0,S,S);c.save();c.beginPath();c.moveTo(0,0);c.lineTo(t/.6,0);c.lineTo(0,t/.4);c.closePath();c.clip();c.fillStyle='#1d7468';paint(c,ch);c.restore();if(p<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
 const me=$('#me'),m=ctxs.me;let dn=false,last;m.lineWidth=14;m.lineCap='round';m.strokeStyle='#d99a1c';
 const pt=e=>{const r=me.getBoundingClientRect();return[(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]};
 me.onpointerdown=e=>{dn=true;last=pt(e);me.setPointerCapture(e.pointerId);m.beginPath();m.moveTo(...last);m.lineTo(last[0]+.1,last[1]);m.stroke()};
 me.onpointermove=e=>{if(!dn)return;const p=pt(e);m.beginPath();m.moveTo(...last);m.lineTo(...p);m.stroke();last=p};me.onpointerup=()=>dn=false;
 $('#chk').onclick=()=>{const mk=()=>{const c=document.createElement('canvas');c.width=c.height=S;return c.getContext('2d')},a=mk(),b=mk();paint(a,chars()[ci]);b.strokeStyle='#000';paint(b,chars()[ci],30);
  const A=a.getImageData(0,0,S,S).data,B=b.getImageData(0,0,S,S).data,M=m.getImageData(0,0,S,S).data;let g=0,c=0,mm=0,s=0;
  for(let i=3;i<A.length;i+=4){const ga=A[i]>100,ma=M[i]>100;if(ga){g++;if(ma)c++}if(ma){mm++;if(B[i]<=100)s++}}
  const sc=mm?Math.round(100*(c/g)*(1-s/mm)):0;$('#sc').textContent=`Điểm: ${sc}/100`;toast(sc>=70?'Rất tốt!':sc>=40?'Khá ổn, thử bám sát nét mẫu hơn.':'Hãy xem mô phỏng rồi viết lại.')};
 chips();load()}});

App.register({id:'data',title:'Dữ liệu',render(el){
 const pl=LS.get('plugins',[]);
 el.innerHTML=`<h3>Thêm từ vựng</h3><p class="hint">Chọn file .xlsx / .csv / .json (cột: STT, Tiếng Thái, Phiên âm, Tiếng Việt, Câu ví dụ “Thái (Việt)”). Từ mới được cộng dồn vào bộ hiện có, từ trùng sẽ bỏ qua.</p>
 <input type="file" id="f" accept=".xlsx,.xls,.csv,.tsv,.json"> <p id="r" class="hint">Hiện có ${ALL.length} từ (${LS.get('custom',[]).length} từ do bạn thêm).</p>
 <div class="row" style="justify-content:flex-start"><button id="ex">Sao lưu tiến độ & dữ liệu</button><button id="im">Khôi phục từ sao lưu</button><button class="bad" id="rs">Xóa từ đã thêm</button></div><input type="file" id="bk" accept=".json" hidden>
 <h3>Thêm bài tập mới (plugin)</h3><p class="hint">Dán đoạn mã dạng <code>App.register({id:'moi',title:'Tên bài',render(el,App){ … }})</code>. Bài tập sẽ tự xuất hiện trên thanh menu và được lưu trong trình duyệt.</p>
 <textarea id="pc" placeholder="App.register({id:'demo',title:'Ví dụ',render(el,App){el.innerHTML='<p>Xin chào</p>'}});"></textarea>
 <div class="row" style="justify-content:flex-start"><button class="good" id="pa">Thêm bài tập</button></div>${pl.map((p,i)=>`<div class="bar">${esc(p.name)}<button class="bad" data-d="${i}">Gỡ</button></div>`).join('')}`;
 const addRows=rows=>{const c=LS.get('custom',[]);const n0=ALL.length;LS.set('custom',[...c,...rows.filter(r=>fromRow(r))]);build();scopeOpts();$('#r').textContent=`Đã thêm ${ALL.length-n0} từ mới. Hiện có ${ALL.length} từ.`};
 const csv=t=>{const d=t.includes('\t')?'\t':',';return t.split(/\r?\n/).filter(Boolean).map(l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o})};
 $('#f').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{
  if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
   const wb=XLSX.read(await f.arrayBuffer());addRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}))}
  else{const t=await f.text();addRows(/\.json$/i.test(f.name)?JSON.parse(t).map(o=>Array.isArray(o)?o:[o.stt,o.th,o.rom,o.vi,o.ex]):csv(t))}}catch(err){toast('Không đọc được file: '+err.message)}};
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({custom:LS.get('custom',[]),known:K,wrong:W,plugins:LS.get('plugins',[])})],{type:'application/json'}));a.download='thai-backup.json';a.click()};
 $('#im').onclick=()=>$('#bk').click();$('#bk').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());['custom','plugins'].forEach(k=>LS.set(k,o[k]||[]));K=o.known||{};W=o.wrong||{};LS.set('known',K);LS.set('wrong',W);toast('Đã khôi phục. Đang tải lại…');setTimeout(()=>location.reload(),700)}catch(err){toast('File sao lưu không hợp lệ')}};
 $('#rs').onclick=()=>{if(confirm('Xóa toàn bộ từ bạn đã thêm?')){LS.set('custom',[]);build();scopeOpts();show()}};
 $('#pa').onclick=()=>{const code=$('#pc').value.trim();if(!code)return;try{new Function('App',code)(App);const id=(code.match(/title\s*:\s*['"`]([^'"`]+)/)||[])[1]||'Bài tập';LS.set('plugins',[...pl,{name:id,code}]);toast('Đã thêm bài tập mới');show()}catch(err){toast('Lỗi mã: '+err.message)}};
 el.onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;pl.splice(+b.dataset.d,1);LS.set('plugins',pl);location.reload()}}});

/* ===== KHỞI ĐỘNG ===== */
build();scopeOpts();
LS.get('plugins',[]).forEach(p=>{try{new Function('App',p.code)(App)}catch(e){console.warn('Plugin lỗi',p.name,e)}});
if(!location.hash)location.hash='flash';show();
</script></body></html>
